
name: Python Docker CI-CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Docker image
        run: docker build -t student-management-app .

      - name: Test Python application
        run: |
          python -m pip install -r requirements.txt
          python -m unittest -v

      - name: Deploy application
        run: |
          docker run -d --name student-app -p 8080:5000 student-management-app
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail http://localhost:8080
          docker stop student-app
